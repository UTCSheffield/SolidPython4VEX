[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidpython4vex"
version = "0.1.0"
description = "A Python DSL for designing VEX competition robots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["solidpython2"]

[project.optional-dependencies]
convert = ["pythonocc-core"]
scrape = ["playwright"]
simplify = ["numpy", "trimesh", "fast-simplification"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidpython4vex = ["parts/stl/*.stl", "parts/catalog.json"]
